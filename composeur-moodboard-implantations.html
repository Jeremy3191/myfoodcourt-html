<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composeur &middot; Moodboard implantations MyFoodcourt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16130F;--surface:#211C16;--line:#332C23;--paper:#F2EDE4;--muted:#9C9284;--accent:#E5523C}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Inter",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:20;background:rgba(22,19,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.bar h1{font-family:"Fraunces",serif;font-weight:400;font-size:20px;margin:0 8px 0 0}
.bar h1 em{color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ctl input[type=range]{width:120px;accent-color:var(--accent)}
.ctl b{color:var(--paper);font-weight:500;min-width:30px;display:inline-block}
button{font:inherit;font-size:12.5px;background:var(--surface);color:var(--paper);border:1px solid var(--line);border-radius:100px;padding:7px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--paper)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted);padding:12px 20px 0}
#wrap{padding:14px 20px 40px;max-width:1500px;margin:0 auto}
#board{width:100%}
.row{display:flex;gap:var(--gap)}
.row+.row{margin-top:var(--gap)}
.cell{position:relative;overflow:hidden;border-radius:var(--rad);background:var(--surface);cursor:grab;min-width:0}
.cell img{display:block;width:100%;height:auto;aspect-ratio:var(--ar);object-fit:cover;pointer-events:none}
.cell.drag{opacity:.35}
.cell.over{outline:3px solid var(--accent);outline-offset:-3px}
.cell .tb{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.15s}
.cell:hover .tb{opacity:1}
.tb button{padding:4px 9px;border-radius:6px;background:rgba(0,0,0,.72);border-color:transparent;font-size:12px}
.tb button:hover{background:var(--accent)}
.cell .n{position:absolute;left:8px;bottom:8px;font-size:10.5px;letter-spacing:.1em;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:5px;opacity:0;transition:.15s}
.cell:hover .n{opacity:1}
#pool{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
#pool h2{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 12px}
#poolgrid{display:flex;flex-wrap:wrap;gap:8px}
.pt{position:relative;width:120px;height:90px;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--surface)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt:hover{border-color:var(--accent)}
#drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:none}
#drawer.on{display:block}
#dpanel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--ink);border-left:1px solid var(--line);padding:18px;overflow:auto}
#dpanel h3{font-family:"Fraunces",serif;font-weight:400;font-size:22px;margin:0 0 4px}
#dpanel p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
#dgrid{column-count:2;column-gap:10px}
.dt{break-inside:avoid;margin:0 0 10px;position:relative;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.dt img{width:100%;height:auto;display:block}
.dt:hover{border-color:var(--accent)}
.dt .u{position:absolute;left:6px;top:6px;font-size:10.5px;background:rgba(0,0,0,.7);padding:2px 7px;border-radius:5px}
.dt.used img{opacity:.55}
.nw{position:absolute;right:6px;top:6px;z-index:2;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#fff;padding:2px 7px;border-radius:5px;font-weight:600}
#rec{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}
#rec.on{display:flex}
#recbox{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;gap:12px}
#recbox textarea{width:100%;height:340px;background:var(--surface);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
@media(max-width:700px){.row{display:contents}#board{column-count:2;column-gap:var(--gap)}.cell{margin-bottom:var(--gap);break-inside:avoid}}
</style>
</head>
<body>
<div class="bar">
  <h1>Composeur &middot; <em>implantations</em></h1>
  <label class="ctl">Hauteur de rang&eacute;e <input id="h" type="range" min="160" max="460" step="10" value="300"><b id="hv">300</b></label>
  <label class="ctl">&Eacute;cart <input id="g" type="range" min="0" max="20" step="1" value="6"><b id="gv">6</b></label>
  <label class="ctl">Arrondi <input id="r" type="range" min="0" max="20" step="1" value="6"><b id="rv">6</b></label>
  <span class="spacer"></span>
  <button id="reset">R&eacute;initialiser</button>
  <button id="rnd">M&eacute;langer</button>
  <button class="pri" id="exp">Exporter la recette</button>
</div>
<p class="hint">Glisser une photo pour la d&eacute;placer &middot; au survol : &larr; &rarr; pour d&eacute;caler, &#8644; pour remplacer ou &eacute;changer, &times; pour retirer &middot; les photos retir&eacute;es restent dans la r&eacute;serve en bas.</p>
<div id="wrap">
  <div id="board"></div>
  <div id="pool"><h2>R&eacute;serve &mdash; photos hors tableau</h2><div id="poolgrid"></div></div>
</div>
<div id="drawer"><div id="dpanel"><button id="dclose" style="float:right">Fermer</button><h3>Remplacer ou &eacute;changer</h3><p id="dsub"></p><div id="dgrid"></div></div></div>
<div id="rec"><div id="recbox"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Recette du tableau</strong><button id="rclose">Fermer</button></div><textarea id="rtxt" readonly></textarea><div style="display:flex;gap:10px"><button class="pri" id="rcopy">Copier</button><span id="rok" style="font-size:12px;color:var(--muted);align-self:center"></span></div></div></div>
<script>
var IK = 'https://ik.imagekit.io/s5mu464sti';
var PHOTOS = [{"n": "maroc-tajine-poulet-decor.jpg", "w": 2000, "h": 1500, "t": "produit", "c": "Tajine de poulet & décor"}, {"n": "maroc-gueridon-menu-du-jour.jpg", "w": 1500, "h": 2000, "t": "univers", "c": "Guéridon & menu du jour"}, {"n": "maroc-tajine-bols-passe.jpg", "w": 2000, "h": 1500, "t": "produit", "c": "Tajines au passe"}, {"n": "afrique-service-passe-vitre.jpg", "w": 2000, "h": 1500, "t": "univers", "c": "Service au passe vitré"}, {"n": "afrique-poulet-yassa-wax.jpg", "w": 2000, "h": 1500, "t": "produit", "c": "Poulet yassa sur wax"}, {"n": "afrique-table-wax-cuisine.jpg", "w": 2000, "h": 1500, "t": "univers", "c": "Table wax & cuisine ouverte"}, {"n": "afrique-ecran-animation.jpg", "w": 2000, "h": 1500, "t": "univers", "c": "Écran d'animation"}, {"n": "afrique-totem-nappes-wax.jpg", "w": 1500, "h": 2000, "t": "univers", "c": "Totem & nappes wax"}, {"n": "mexique-plat-feuille-banane.jpg", "w": 1200, "h": 1600, "t": "produit", "c": "Plat en feuille de bananier"}, {"n": "japon-comptoir-sakura.jpg", "w": 1600, "h": 1200, "t": "univers", "c": "Comptoir fleuri"}, {"n": "popup-comptoir-equipe.jpg", "w": 1600, "h": 728, "t": "univers", "c": "Comptoir pop-up"}, {"n": "japon-equipe-ramen-marmites.jpg", "w": 1920, "h": 1080, "t": "univers", "c": "Équipe & marmites"}, {"n": "japon-bol-ramen.jpg", "w": 1500, "h": 2000, "t": "produit", "c": "Bol de ramen"}, {"n": "japon-chef-marmite.jpg", "w": 1500, "h": 2000, "t": "univers", "c": "Chef à la marmite"}, {"n": "mexique-vitrine-papel-picado.jpg", "w": 1920, "h": 1080, "t": "univers", "c": "Vitrine & guirlandes"}, {"n": "bol-lentilles-boeuf-houmous.jpg", "w": 1500, "h": 2000, "t": "produit", "c": "Bol lentilles, bœuf, houmous"}, {"n": "maroc-deco-comptoir.jpg", "w": 2000, "h": 1500, "t": "univers", "c": "Décor sur comptoir"}, {"n": "mexique-cuisine-papel-picado-chef.jpg", "w": 2000, "h": 910, "t": "univers", "c": "Cuisine ouverte & guirlandes", "nw": 1}, {"n": "afrique-totem-menu-yassa-wax.jpg", "w": 1501, "h": 2000, "t": "univers", "c": "Totem & nappes wax (nouvelle version)", "nw": 1}, {"n": "maroc-deco-comptoir-cartes.jpg", "w": 2000, "h": 1500, "t": "univers", "c": "Décor sur comptoir (nouvelle version)", "nw": 1}, {"n": "maroc-gueridon-the-menu.jpg", "w": 1501, "h": 2000, "t": "univers", "c": "Guéridon & menu du jour (nouvelle version)", "nw": 1}];
var DEFAULT_ORDER = ["afrique-table-wax-cuisine.jpg", "afrique-totem-nappes-wax.jpg", "afrique-service-passe-vitre.jpg", "japon-equipe-ramen-marmites.jpg", "japon-chef-marmite.jpg", "japon-bol-ramen.jpg", "maroc-deco-comptoir.jpg", "maroc-gueridon-menu-du-jour.jpg", "maroc-tajine-bols-passe.jpg", "popup-comptoir-equipe.jpg", "bol-lentilles-boeuf-houmous.jpg", "mexique-plat-feuille-banane.jpg", "mexique-vitrine-papel-picado.jpg"];
var byName = {};
PHOTOS.forEach(function(p){ byName[p.n] = p; });
var DEF = {h:440,g:6,r:0};
var st = { order: DEFAULT_ORDER.slice(), h: DEF.h, g: DEF.g, r: DEF.r };
var board = document.getElementById('board');
var dragName = null, swapIdx = -1;

function url(n, w){ return IK + '/moodboards/implantations/' + n + '?tr=w-' + w + ',q-80'; }
function ratio(n){ var p = byName[n]; return p.w / p.h; }

function partition(rs, k){
  var n = rs.length; if (k >= n) return rs.map(function(_, i){ return [i, i + 1]; });
  var pre = [0]; rs.forEach(function(r){ pre.push(pre[pre.length - 1] + r); });
  var target = pre[n] / k, INF = 1e18;
  var cost = [], cut = [];
  for (var j = 0; j <= k; j++){ cost.push(new Array(n + 1).fill(INF)); cut.push(new Array(n + 1).fill(0)); }
  cost[0][0] = 0;
  for (var j2 = 1; j2 <= k; j2++){
    for (var i = j2; i <= n; i++){
      for (var m = j2 - 1; m < i; m++){
        if (cost[j2 - 1][m] >= INF) continue;
        var s = pre[i] - pre[m], c = cost[j2 - 1][m] + (s - target) * (s - target);
        if (c < cost[j2][i]){ cost[j2][i] = c; cut[j2][i] = m; }
      }
    }
  }
  var rows = [], i2 = n;
  for (var j3 = k; j3 >= 1; j3--){ var m2 = cut[j3][i2]; rows.unshift([m2, i2]); i2 = m2; }
  return rows;
}

function render(){
  document.documentElement.style.setProperty('--gap', st.g + 'px');
  document.documentElement.style.setProperty('--rad', st.r + 'px');
  var W = board.clientWidth, H = W < 700 ? st.h * 0.55 : st.h;
  var rs = st.order.map(ratio), tot = rs.reduce(function(a, b){ return a + b; }, 0);
  var k = Math.max(1, Math.round(tot * H / W));
  var rows = rs.length ? partition(rs, Math.min(k, rs.length)) : [];
  board.innerHTML = '';
  rows.forEach(function(rg){
    var row = document.createElement('div'); row.className = 'row';
    for (var i = rg[0]; i < rg[1]; i++){
      var n = st.order[i], p = byName[n];
      var c = document.createElement('div'); c.className = 'cell'; c.draggable = true; c.dataset.i = i;
      c.style.flex = ratio(n) + ' 1 0';
      c.style.setProperty('--ar', p.w + '/' + p.h);
      c.innerHTML = '<img loading="lazy" alt="' + p.c + '" src="' + url(n, 1200) + '" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="tb"><button data-a="l" title="Avant">&larr;</button><button data-a="r" title="Après">&rarr;</button><button data-a="s" title="Remplacer / échanger">&#8644;</button><button data-a="x" title="Retirer">&times;</button></div>' +
        '<span class="n">' + (i + 1) + ' &middot; ' + p.c + '</span>';
      row.appendChild(c);
    }
    board.appendChild(row);
  });
  var pg = document.getElementById('poolgrid'); pg.innerHTML = '';
  var unused = PHOTOS.filter(function(p){ return st.order.indexOf(p.n) < 0; });
  if (!unused.length){ pg.innerHTML = '<span style="font-size:12.5px;color:var(--muted)">Toutes les photos sont dans le tableau.</span>'; }
  unused.forEach(function(p){
    var d = document.createElement('div'); d.className = 'pt'; d.title = 'Ajouter : ' + p.c; d.dataset.n = p.n;
    d.innerHTML = '<img src="' + url(p.n, 320) + '" alt="' + p.c + '">' + (p.nw ? '<span class="nw">Nouveau</span>' : ''); pg.appendChild(d);
  });
  save();
}

function save(){ try { location.hash = btoa(unescape(encodeURIComponent(JSON.stringify(st)))); } catch(e){} }
function load(){
  try {
    var s = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
    if (s && s.order){ st.order = s.order.filter(function(n){ return byName[n]; }); st.h = s.h || DEF.h; st.g = s.g != null ? s.g : DEF.g; st.r = s.r != null ? s.r : DEF.r; }
  } catch(e){}
}
function sync(){
  document.getElementById('h').value = st.h; document.getElementById('hv').textContent = st.h;
  document.getElementById('g').value = st.g; document.getElementById('gv').textContent = st.g;
  document.getElementById('r').value = st.r; document.getElementById('rv').textContent = st.r;
}
function move(i, d){ var j = i + d; if (j < 0 || j >= st.order.length) return; var t = st.order[i]; st.order[i] = st.order[j]; st.order[j] = t; render(); }

board.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var i = +b.closest('.cell').dataset.i, a = b.dataset.a;
  if (a === 'l') move(i, -1); else if (a === 'r') move(i, 1);
  else if (a === 'x'){ st.order.splice(i, 1); render(); }
  else if (a === 's') openDrawer(i);
});
board.addEventListener('dragstart', function(e){ var c = e.target.closest('.cell'); if (!c) return; dragName = +c.dataset.i; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'x'); } catch(_){} });
board.addEventListener('dragend', function(){ dragName = null; render(); });
board.addEventListener('dragover', function(e){ var c = e.target.closest('.cell'); if (!c || dragName === null) return; e.preventDefault(); [].forEach.call(board.querySelectorAll('.over'), function(x){ x.classList.remove('over'); }); c.classList.add('over'); });
board.addEventListener('drop', function(e){
  var c = e.target.closest('.cell'); if (!c || dragName === null) return; e.preventDefault();
  var to = +c.dataset.i, from = dragName; dragName = null;
  var it = st.order.splice(from, 1)[0]; st.order.splice(to, 0, it); render();
});

function openDrawer(i){
  swapIdx = i;
  document.getElementById('dsub').textContent = 'Position ' + (i + 1) + ' — cliquer une photo : non utilisée = remplace, déjà utilisée = échange les places.';
  var g = document.getElementById('dgrid'); g.innerHTML = '';
  PHOTOS.forEach(function(p){
    if (p.n === st.order[i]) return;
    var pos = st.order.indexOf(p.n), d = document.createElement('div');
    d.className = 'dt' + (pos >= 0 ? ' used' : ''); d.dataset.n = p.n;
    d.innerHTML = '<img src="' + url(p.n, 480) + '" alt="' + p.c + '">' + (pos >= 0 ? '<span class="u">n° ' + (pos + 1) + '</span>' : '<span class="u">libre</span>') + (p.nw ? '<span class="nw">Nouveau</span>' : '');
    g.appendChild(d);
  });
  document.getElementById('drawer').classList.add('on');
}
document.getElementById('dgrid').addEventListener('click', function(e){
  var d = e.target.closest('.dt'); if (!d) return;
  var n = d.dataset.n, pos = st.order.indexOf(n);
  if (pos >= 0){ var t = st.order[swapIdx]; st.order[swapIdx] = n; st.order[pos] = t; } else { st.order[swapIdx] = n; }
  document.getElementById('drawer').classList.remove('on'); render();
});
document.getElementById('dclose').onclick = function(){ document.getElementById('drawer').classList.remove('on'); };
document.getElementById('drawer').addEventListener('click', function(e){ if (e.target.id === 'drawer') this.classList.remove('on'); });
document.getElementById('poolgrid').addEventListener('click', function(e){ var d = e.target.closest('.pt'); if (!d) return; st.order.push(d.dataset.n); render(); });

['h', 'g', 'r'].forEach(function(id){ document.getElementById(id).addEventListener('input', function(){ st[id] = +this.value; sync(); render(); }); });
document.getElementById('reset').onclick = function(){ st.order = DEFAULT_ORDER.slice(); st.h = DEF.h; st.g = DEF.g; st.r = DEF.r; sync(); render(); };
document.getElementById('rnd').onclick = function(){ var a = st.order.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } st.order = a; render(); };
document.getElementById('exp').onclick = function(){
  var L = ['Moodboard implantations', '  hauteur: ' + st.h + ' | ecart: ' + st.g + ' | arrondi: ' + st.r, '  ordre (' + st.order.length + ' photos) :'];
  st.order.forEach(function(n, i){ L.push('  ' + (i + 1) + '. ' + byName[n].c + '  [' + n + ']'); });
  var un = PHOTOS.filter(function(p){ return st.order.indexOf(p.n) < 0; });
  if (un.length){ L.push('  non retenues :'); un.forEach(function(p){ L.push('  - ' + p.c + '  [' + p.n + ']'); }); }
  document.getElementById('rtxt').value = L.join('\n'); document.getElementById('rok').textContent = ''; document.getElementById('rec').classList.add('on');
};
document.getElementById('rclose').onclick = function(){ document.getElementById('rec').classList.remove('on'); };
document.getElementById('rcopy').onclick = function(){ var t = document.getElementById('rtxt'); t.select(); try { document.execCommand('copy'); document.getElementById('rok').textContent = 'Copié.'; } catch(e){} };
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(render, 120); });
load(); sync(); render();
</script>
</body>
</html>
